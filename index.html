<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Reelseex</title>
<link rel="icon" type="image/svg+xml" href="./assets/logo.svg">
<script src="./config.js"></script>
<!-- SDK Mini App — локальная копия (webapp/vendor): telegram.org из России без VPN не открывается, и без SDK
     приложение не получало initData. Обновление: см. README «SDK Telegram». -->
<script src="./vendor/telegram-web-app.js"></script>
<style>
/* Mini App бота Reelseex — одностраничное приложение (app.js), моки для демо (demo.js), настройки (config.js).
   Тема своя, фирменная: «чернила + лайм» из логотипа; палитру Telegram (--tg-theme-*) намеренно не берём, чтобы
   приложение выглядело одинаково у всех. Светлая/тёмная — по теме Telegram: app.js ставит data-theme на <html>
   (в браузере без Telegram — по prefers-color-scheme). Шрифт заголовков Unbounded лежит рядом (assets/, лицензия OFL). */
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 500 800; font-display: swap; src: url(./assets/unbounded-cyrillic.woff2) format("woff2");
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 500 800; font-display: swap; src: url(./assets/unbounded-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root {
  --bg: #0a0913;
  --card: rgba(255, 255, 255, .055);
  --card-hi: rgba(255, 255, 255, .09);
  --stroke: rgba(255, 255, 255, .09);
  --fg: #f5f4fb;
  --hint: #9e9bb5;
  --sub: #b9b6cf;
  --sep: rgba(255, 255, 255, .08);
  --accent: #c8ff3d;
  --accent-text: #c8ff3d;
  --on-accent: #0b0a14;
  --violet: #8b5cf6;
  --pink: #ff4fa3;
  --link: #c8ff3d;
  --danger: #ff6b81;
  --ok: #6ff0a0;
  --chip: rgba(255, 255, 255, .07);
  --chip-on: rgba(200, 255, 61, .14);
  --field: rgba(255, 255, 255, .05);
  --glass: rgba(18, 16, 32, .78);
  --shadow: 0 14px 40px rgba(0, 0, 0, .38);
  --glow: 0 6px 22px rgba(200, 255, 61, .28);
  --aura: radial-gradient(60% 38% at 12% 0%, rgba(139, 92, 246, .42), transparent 70%), radial-gradient(46% 30% at 100% 12%, rgba(255, 79, 163, .20), transparent 70%),
    radial-gradient(70% 34% at 60% 108%, rgba(200, 255, 61, .14), transparent 70%);
  --radius: 22px;
  --radius-s: 14px;
  --tabbar-h: 62px;
  --safe-b: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif;
  --display: "Unbounded", -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f2f0e9; --card: #ffffff; --card-hi: #ffffff; --stroke: rgba(20, 16, 42, .07); --fg: #14112a; --hint: #6e6a85; --sub: #56526e; --sep: rgba(20, 16, 42, .08);
  --accent-text: #14112a; --on-accent: #14112a; --link: #5b3df0; --danger: #d92d4a; --ok: #178a4b; --chip: rgba(20, 16, 42, .06); --chip-on: rgba(200, 255, 61, .5);
  --field: #f6f5f0; --glass: rgba(255, 255, 255, .86); --shadow: 0 8px 28px rgba(40, 28, 90, .09); --glow: 0 6px 20px rgba(150, 200, 20, .35);
  --aura: radial-gradient(60% 34% at 10% 0%, rgba(139, 92, 246, .16), transparent 70%), radial-gradient(46% 28% at 100% 10%, rgba(255, 79, 163, .10), transparent 70%),
    radial-gradient(70% 30% at 60% 108%, rgba(200, 255, 61, .30), transparent 70%);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --bg: #f2f0e9; --card: #ffffff; --card-hi: #ffffff; --stroke: rgba(20, 16, 42, .07); --fg: #14112a; --hint: #6e6a85; --sub: #56526e; --sep: rgba(20, 16, 42, .08);
    --accent-text: #14112a; --on-accent: #14112a; --link: #5b3df0; --danger: #d92d4a; --ok: #178a4b; --chip: rgba(20, 16, 42, .06); --chip-on: rgba(200, 255, 61, .5);
    --field: #f6f5f0; --glass: rgba(255, 255, 255, .86); --shadow: 0 8px 28px rgba(40, 28, 90, .09); --glow: 0 6px 20px rgba(150, 200, 20, .35);
    --aura: radial-gradient(60% 34% at 10% 0%, rgba(139, 92, 246, .16), transparent 70%), radial-gradient(46% 28% at 100% 10%, rgba(255, 79, 163, .10), transparent 70%),
      radial-gradient(70% 30% at 60% 108%, rgba(200, 255, 61, .30), transparent 70%);
    color-scheme: light;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
html, body { margin: 0; color: var(--fg); font: 16px/1.4 var(--font); }
body {
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(var(--tg-content-safe-area-inset-top, 0px) + 12px);
  padding-bottom: calc(24px + var(--safe-b));
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--aura); }
body.tabs-on { padding-bottom: calc(var(--tabbar-h) + 36px + var(--safe-b)); }
body.has-bar { padding-bottom: calc(var(--tabbar-h) + 104px + var(--safe-b)); }
body.has-bar:not(.tabs-on) { padding-bottom: calc(92px + var(--safe-b)); }
button, textarea, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:disabled { cursor: default; opacity: .5; }
a { color: var(--link); text-decoration: none; }
[hidden] { display: none !important; }
ul, ol { margin: 6px 0 0; padding-left: 20px; }
ul.notes li, ol.notes li { margin: 4px 0; font-size: 14.5px; }
ul.notes li::marker { color: var(--accent-text); }
i { font-style: italic; }

/* бренд */
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 38px; height: 38px; border-radius: 12px; display: block; box-shadow: var(--glow); }
.brand .word { font: 700 20px/1 var(--display); letter-spacing: -.03em; }
.brand .word b { color: var(--accent-text); font-weight: 800; }
:root[data-theme="light"] .brand .word b { background: var(--accent); border-radius: 6px; padding: 0 3px; }
.hero { text-align: center; padding: 18px 8px 26px; }
.hero img { width: 92px; height: 92px; border-radius: 28px; display: block; margin: 0 auto 18px; box-shadow: 0 18px 50px rgba(200, 255, 61, .30); }
.hero h1 { margin: 0; font: 800 30px/1.08 var(--display); letter-spacing: -.035em; }
.hero h1 b { color: var(--accent-text); }
.hero p { margin: 10px auto 0; max-width: 30ch; color: var(--hint); font-size: 15px; }

/* шапка экрана */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 6px 2px 16px; }
.top h1 { margin: 0; font: 700 25px/1.12 var(--display); letter-spacing: -.03em; overflow-wrap: anywhere; }
.top .sub { color: var(--hint); font-size: 14px; margin-top: 5px; font-variant-numeric: tabular-nums; }
.credits { flex: none; text-align: right; font-size: 11.5px; color: var(--hint); line-height: 1.3; padding: 7px 11px; border-radius: var(--radius-s); background: var(--card);
  border: 1px solid var(--stroke); }
.credits b { display: block; font: 700 13.5px/1.25 var(--display); letter-spacing: -.02em; color: var(--fg); font-variant-numeric: tabular-nums; }
.credits.low b { color: var(--danger); }
.demo-note { font-size: 11.5px; color: var(--hint); text-align: center; margin: -4px auto 10px; padding: 4px 10px; border-radius: 999px; background: var(--chip); width: fit-content; }
.diag { font-size: 12px; color: var(--hint); text-align: left; margin: 12px 0 0; width: 100%; }
.diag summary { cursor: pointer; text-align: center; }
.diag pre { font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; margin: 8px 0 0; padding: 10px; border-radius: 12px; background: var(--field); }
.back { display: inline-block; color: var(--link); font-size: 15px; font-weight: 600; padding: 4px 2px 10px; }
.dots { display: flex; gap: 6px; margin: -6px 2px 14px; }
.dots span { flex: 1 1 0; height: 4px; border-radius: 2px; background: var(--chip); transition: background .25s; }
.dots span.on { background: var(--accent); box-shadow: 0 0 12px rgba(200, 255, 61, .5); }

/* клипы */
.strip { display: flex; gap: 4px; height: 42px; margin: 0 0 16px; }
.strip .seg { flex: 1 1 0; min-width: 24px; border-radius: 12px; background: linear-gradient(135deg, var(--violet), var(--pink)); color: #fff; display: flex; align-items: center;
  justify-content: center; font-size: 12px; font-weight: 700; overflow: hidden; white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
.strip .seg:nth-child(even) { background: linear-gradient(135deg, #6d4bff, var(--violet)); }
.strip.empty { height: auto; min-height: 76px; border: 1.5px dashed var(--stroke); border-radius: var(--radius); color: var(--hint); align-items: center; justify-content: center; font-size: 14px;
  padding: 14px 16px; text-align: center; background: var(--card); }
.clips { display: flex; flex-wrap: wrap; gap: 8px; }
.clipc { display: flex; align-items: center; gap: 7px; padding: 6px 6px 6px 12px; border-radius: 12px; background: var(--chip); border: 1px solid var(--stroke); font-size: 14px; }
.clipc .n { font: 700 12px/1 var(--display); color: var(--accent-text); }
.clipc .d { font-variant-numeric: tabular-nums; }
.clipc .x, .item .x { width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: var(--danger); font-size: 18px; flex: none;
  background: color-mix(in srgb, var(--danger) 12%, transparent); }
.clipc .nm { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--hint); }
/* загрузка клипов из приложения: строка на файл — имя, процент, полоса */
.ups { margin-top: 10px; }
.up { font-size: 13.5px; }
.up + .up { margin-top: 10px; }
.up .ln { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.up .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.up .pct { flex: none; max-width: 55%; text-align: right; color: var(--hint); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.up.ok .pct { color: var(--ok); }
.up.err .pct { color: var(--danger); }
.up .bar { height: 6px; margin-top: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.up .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--violet), var(--accent)); transition: width .2s linear; }
.up.err .bar i { background: var(--danger); }
.up.wait .bar i { opacity: .4; }

/* секции и строки */
.sec, .list, .state { background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.sec { padding: 16px; margin-bottom: 12px; }
.sec h2 { margin: 0 0 12px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--hint); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.row + .row { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--sep); }
.row .lbl { min-width: 0; overflow-wrap: anywhere; }
.row .lbl small { display: block; color: var(--hint); font-size: 13px; margin-top: 2px; }
.hint { color: var(--hint); font-size: 13.5px; margin: 8px 0 0; }
.lead { margin: 8px 0 0; font-size: 15px; }
.lead:first-child { margin-top: 0; }
.lead b { font-weight: 700; color: var(--accent-text); }
:root[data-theme="light"] .lead b { background: var(--chip-on); border-radius: 5px; padding: 0 4px; }
.title { font-weight: 700; font-size: 17px; margin: 8px 0 4px; letter-spacing: -.01em; }
.center { text-align: center; }
.understood { margin: 0 0 12px; font-size: 15px; padding: 10px 12px; border-radius: var(--radius-s); background: var(--chip-on); }
.understood b { font-weight: 700; }
.blk { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--sep); font-size: 14.5px; }
.blk p { margin: 4px 0 0; }
.blk > b { font-weight: 700; display: block; }
.fact { font-size: 15px; }
.fact + .fact { margin-top: 6px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; color: var(--sub); font-size: 13px; margin-top: 10px; font-variant-numeric: tabular-nums; }
.stats span { padding: 4px 9px; border-radius: 999px; background: var(--chip); }
.bignum { display: inline-block; font: 800 40px/1.05 var(--display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; background: linear-gradient(120deg, var(--fg) 30%, var(--accent));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
:root[data-theme="light"] .bignum { background: linear-gradient(120deg, var(--fg) 40%, var(--violet)); -webkit-background-clip: text; background-clip: text; }
textarea, input[type="text"], input[type="url"] {
  width: 100%; border: 1px solid var(--stroke); border-radius: var(--radius-s); padding: 11px 13px; background: var(--field); outline: none; -webkit-appearance: none; appearance: none;
  transition: border-color .15s, box-shadow .15s;
}
textarea { min-height: 68px; resize: vertical; display: block; }
textarea:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
textarea::placeholder, input::placeholder { color: var(--hint); }
.field { margin-top: 12px; }
.field.inline { display: flex; gap: 8px; margin-top: 0; }
.field.inline input { flex: 1 1 auto; min-width: 0; }
.field.inline .act { flex: none; }

/* сегменты, чипы, кнопки */
.segc { display: flex; background: var(--chip); border-radius: var(--radius-s); padding: 4px; gap: 2px; }
.segc button { flex: 1 1 0; padding: 8px 4px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--hint); text-align: center; transition: background .15s, color .15s; }
.segc button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; box-shadow: var(--glow); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 999px; background: var(--chip); font-size: 14px; font-weight: 600; color: var(--fg); border: 1px solid var(--stroke);
  transition: background .15s, border-color .15s, color .15s, transform .1s; }
.chip:active, .act:active, .pack:active, .bar-btn:active { transform: scale(.97); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: var(--glow); }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 10px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.acts.center { justify-content: center; }
.acts.flush { margin-top: 0; }
.act { padding: 10px 15px; border-radius: var(--radius-s); background: var(--chip); border: 1px solid var(--stroke); font-size: 14px; font-weight: 600; color: var(--fg);
  white-space: nowrap; transition: transform .1s, background .15s; }
.act.link { color: var(--link); }
.act.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; box-shadow: var(--glow); }
.act.more { display: block; width: 100%; text-align: center; padding: 14px; margin-bottom: 12px; }
.lnk { color: var(--link); font: inherit; font-size: inherit; display: inline; font-weight: 600; }
.sw { position: relative; flex: none; width: 50px; height: 30px; border-radius: 15px; background: var(--chip); border: 1px solid var(--stroke); transition: background .18s, border-color .18s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
  transition: transform .18s cubic-bezier(.3, 1.4, .5, 1), background .18s; }
.sw[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(20px); background: var(--on-accent); }
.sw:focus-visible, .chip:focus-visible, .segc button:focus-visible, .act:focus-visible, .item:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* тренд-звук в редакторе */
.sound { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--sep); }
.sound .name, .sec .name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.sound .meta, .sec .meta { color: var(--hint); font-size: 13.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.how { margin: 10px 0 0; font-size: 14.5px; }
.how b { font-weight: 700; }
.vars { margin-top: 12px; }
.vars .lab, .picker .lab { color: var(--hint); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
.vsum { margin: 8px 0 0; font-size: 14px; }
.picker { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--sep); }
.picker .item.on { background: var(--chip-on); }
.split { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--sep); }

/* списки */
.list { margin-bottom: 12px; overflow: hidden; }
.item { display: block; width: 100%; padding: 13px 16px; border-radius: 12px; transition: background .12s; }
.list .item { border-radius: 0; }
.list .item + .item { border-top: 1px solid var(--sep); }
.item:active, .item.static .grow:active { background: var(--chip); }
.item .t { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.item .m { color: var(--hint); font-size: 13px; margin-top: 3px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.item.static { display: flex; align-items: center; gap: 8px; padding-right: 10px; }
.item.static .grow { flex: 1 1 auto; min-width: 0; padding: 0; }
.picker .item, .sec .item { padding: 10px; margin: 0 -4px; width: calc(100% + 8px); }
.picker .item + .item, .sec .item + .item { border-top: 1px solid var(--sep); }
.ledger .row b { font-variant-numeric: tabular-nums; }
.ledger .plus { color: var(--ok); }
.ledger .minus { color: var(--fg); }
.packs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.pack { flex: 1 1 92px; display: flex; flex-direction: column; gap: 3px; padding: 13px; border-radius: 18px; background: var(--card-hi); border: 1px solid var(--stroke); transition: transform .1s, border-color .15s; }
.pack b { font: 700 13.5px/1.2 var(--display); letter-spacing: -.02em; }
.pack span { color: var(--accent-text); font-size: 15px; font-weight: 700; }
.pack small { color: var(--hint); font-size: 11.5px; }
.pack:active { border-color: var(--accent); }

/* состояния */
.state { text-align: center; padding: 32px 18px; margin-bottom: 12px; }
.state .big { width: 76px; height: 76px; margin: 0 auto; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 36px; line-height: 1;
  background: radial-gradient(circle at 30% 20%, rgba(200, 255, 61, .30), rgba(139, 92, 246, .22) 60%, transparent 100%), var(--chip); border: 1px solid var(--stroke); }
.state .title { margin: 16px 0 4px; font: 700 18px/1.2 var(--display); letter-spacing: -.02em; }
.state .hint { margin: 0 auto; max-width: 34ch; }
.spin { width: 34px; height: 34px; margin: 4px auto 0; border: 3px solid var(--chip); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.skel { height: 62px; border-radius: var(--radius); border: 1px solid var(--stroke); background: linear-gradient(90deg, var(--card) 0%, var(--card-hi) 50%, var(--card) 100%);
  background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; }
:root[data-theme="light"] .skel { background-image: linear-gradient(90deg, #fff 0%, #ece9df 50%, #fff 100%); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.warn { color: var(--danger); font-size: 13.5px; margin-top: 8px; }
.foot { color: var(--hint); font-size: 13px; text-align: center; margin: 6px 0 12px; }

/* таббар — плавающая стеклянная капсула; нижняя панель — замена MainButton вне Telegram */
.tabbar { position: fixed; left: 12px; right: 12px; bottom: calc(10px + var(--safe-b)); z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h);
  padding: 0 6px; background: var(--glass); border: 1px solid var(--stroke); border-radius: 24px; box-shadow: var(--shadow); -webkit-backdrop-filter: blur(22px) saturate(1.4);
  backdrop-filter: blur(22px) saturate(1.4); }

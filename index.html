<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Reelseex</title>
<script src="./config.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Mini App бота Reelseex — одностраничное приложение (app.js), моки для демо (demo.js), настройки (config.js).
   Цвета — из темы Telegram (--tg-theme-*), запасные значения — для предпросмотра в браузере. */
:root {
  --bg: var(--tg-theme-secondary-bg-color, #eef0f4);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --fg: var(--tg-theme-text-color, #0f1419);
  --hint: var(--tg-theme-hint-color, #6f7c8a);
  --sub: var(--tg-theme-subtitle-text-color, var(--tg-theme-hint-color, #6f7c8a));
  --sep: var(--tg-theme-section-separator-color, rgba(60, 70, 90, .12));
  --accent: var(--tg-theme-button-color, #2f7cf6);
  --on-accent: var(--tg-theme-button-text-color, #ffffff);
  --link: var(--tg-theme-link-color, #2f7cf6);
  --danger: var(--tg-theme-destructive-text-color, #d9403a);
  --ok: #2e9e5b;
  --chip: color-mix(in srgb, var(--fg) 7%, transparent);
  --chip-on: color-mix(in srgb, var(--accent) 16%, transparent);
  --radius: 14px;
  --tabbar-h: 58px;
  --safe-b: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #0f1216);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #1b2027));
    --fg: var(--tg-theme-text-color, #f2f4f7);
    --hint: var(--tg-theme-hint-color, #8b97a6);
    --sep: var(--tg-theme-section-separator-color, rgba(255, 255, 255, .09));
    --accent: var(--tg-theme-button-color, #4b8ff5);
    --link: var(--tg-theme-link-color, #6ea4ff);
    --ok: #4cc47f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.35 var(--font); }
body {
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-top: calc(var(--tg-content-safe-area-inset-top, 0px) + 10px);
  padding-bottom: calc(24px + var(--safe-b));
  -webkit-font-smoothing: antialiased;
}
body.tabs-on { padding-bottom: calc(var(--tabbar-h) + 20px + var(--safe-b)); }
body.has-bar { padding-bottom: calc(var(--tabbar-h) + 86px + var(--safe-b)); }
body.has-bar:not(.tabs-on) { padding-bottom: calc(86px + var(--safe-b)); }
button, textarea, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:disabled { cursor: default; opacity: .55; }
a { color: var(--link); text-decoration: none; }
[hidden] { display: none !important; }
ul, ol { margin: 6px 0 0; padding-left: 20px; }
ul.notes li, ol.notes li { margin: 3px 0; font-size: 14.5px; }
i { font-style: italic; }

/* шапка экрана */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 6px 2px 14px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.top .sub { color: var(--hint); font-size: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.credits { flex: none; text-align: right; font-size: 13px; color: var(--hint); line-height: 1.25; padding-top: 4px; }
.credits b { display: block; font-size: 17px; color: var(--fg); font-variant-numeric: tabular-nums; }
.credits.low b { color: var(--danger); }
.demo-note { font-size: 12px; color: var(--hint); text-align: center; margin: -4px 0 8px; }
.back { display: inline-block; color: var(--link); font-size: 15px; font-weight: 500; padding: 4px 2px 8px; }
.dots { display: flex; gap: 6px; margin: -6px 2px 12px; }
.dots span { width: 22px; height: 4px; border-radius: 2px; background: var(--chip); }
.dots span.on { background: var(--accent); }

/* клипы */
.strip { display: flex; gap: 3px; height: 34px; margin: 0 2px 16px; }
.strip .seg { flex: 1 1 0; min-width: 22px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center;
  justify-content: center; font-size: 12px; font-weight: 600; overflow: hidden; white-space: nowrap; font-variant-numeric: tabular-nums; }
.strip .seg:nth-child(even) { opacity: .78; }
.strip.empty { border: 1.5px dashed var(--hint); border-radius: 10px; color: var(--hint); align-items: center; justify-content: center; font-size: 14px; padding: 0 10px; text-align: center; }
.clips { display: flex; flex-wrap: wrap; gap: 8px; }
.clipc { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; border-radius: 10px; background: var(--chip); font-size: 14px; }
.clipc .n { font-weight: 700; color: var(--hint); }
.clipc .x, .item .x { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--danger); font-size: 18px; flex: none; }
.clipc .nm { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--hint); }
/* загрузка клипов из приложения: строка на файл — имя, процент, полоса */
.ups { margin-top: 10px; }
.up { font-size: 13.5px; }
.up + .up { margin-top: 8px; }
.up .ln { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.up .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.up .pct { flex: none; max-width: 55%; text-align: right; color: var(--hint); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.up.ok .pct { color: var(--ok); }
.up.err .pct { color: var(--danger); }
.up .bar { height: 4px; margin-top: 5px; border-radius: 2px; background: var(--chip); overflow: hidden; }
.up .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
.up.err .bar i { background: var(--danger); }
.up.wait .bar i { opacity: .4; }

/* секции и строки */
.sec { background: var(--card); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
.sec h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--sub); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.row + .row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--sep); }
.row .lbl { min-width: 0; overflow-wrap: anywhere; }
.row .lbl small { display: block; color: var(--hint); font-size: 13px; margin-top: 1px; }
.hint { color: var(--hint); font-size: 13.5px; margin: 8px 0 0; }
.lead { margin: 8px 0 0; font-size: 15px; }
.lead b { font-weight: 600; }
.title { font-weight: 600; font-size: 16px; margin: 8px 0 4px; }
.center { text-align: center; }
.understood { margin: 0 0 10px; font-size: 15px; }
.understood b { font-weight: 600; }
.blk { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--sep); font-size: 14.5px; }
.blk p { margin: 4px 0 0; }
.blk > b { font-weight: 600; display: block; }
.fact { font-size: 15px; }
.fact + .fact { margin-top: 6px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--hint); font-size: 14px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.bignum { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
textarea, input[type="text"], input[type="url"] {
  width: 100%; border: 1px solid var(--sep); border-radius: 10px; padding: 9px 11px; background: var(--bg); outline: none; -webkit-appearance: none; appearance: none;
}
textarea { min-height: 64px; resize: vertical; display: block; }
textarea:focus, input:focus { border-color: var(--accent); }
textarea::placeholder, input::placeholder { color: var(--hint); }
.field { margin-top: 10px; }
.field.inline { display: flex; gap: 8px; margin-top: 0; }
.field.inline input { flex: 1 1 auto; min-width: 0; }
.field.inline .act { flex: none; }

/* сегменты, чипы, кнопки */
.segc { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.segc button { flex: 1 1 0; padding: 7px 4px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--hint); text-align: center; transition: background .12s, color .12s; }
.segc button[aria-pressed="true"] { background: var(--card); color: var(--fg); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 12px; border-radius: 999px; background: var(--chip); font-size: 14px; font-weight: 500; color: var(--fg); border: 1.5px solid transparent; transition: background .12s, border-color .12s; }
.chip[aria-pressed="true"] { background: var(--chip-on); border-color: var(--accent); }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -14px; padding: 2px 14px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.acts.center { justify-content: center; }
.act { padding: 8px 12px; border-radius: 10px; background: var(--chip); font-size: 14px; font-weight: 500; color: var(--fg); }
.act.link { color: var(--link); }
.act.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.act.more { display: block; width: 100%; text-align: center; padding: 12px; margin-bottom: 12px; }
.lnk { color: var(--link); font: inherit; font-size: inherit; display: inline; }
.sw { position: relative; flex: none; width: 48px; height: 30px; border-radius: 15px; background: var(--chip); transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(18px); }
.sw:focus-visible, .chip:focus-visible, .segc button:focus-visible, .act:focus-visible, .item:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* тренд-звук в редакторе */
.sound { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--sep); }
.sound .name, .sec .name { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.sound .meta, .sec .meta { color: var(--hint); font-size: 13.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.how { margin: 8px 0 0; font-size: 14.5px; }
.how b { font-weight: 600; }
.vars { margin-top: 10px; }
.vars .lab, .picker .lab { color: var(--sub); font-size: 13px; margin-bottom: 6px; }
.vsum { margin: 8px 0 0; font-size: 14px; }
.picker { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--sep); }
.picker .item.on { background: var(--chip-on); }

/* списки */
.list { background: var(--card); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.item { display: block; width: 100%; padding: 11px 14px; border-radius: 10px; }
.list .item { border-radius: 0; }
.list .item + .item { border-top: 1px solid var(--sep); }
.item:active, .item.static .grow:active { background: var(--chip); }
.item .t { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.item .m { color: var(--hint); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.item.static { display: flex; align-items: center; gap: 8px; padding-right: 8px; }
.item.static .grow { flex: 1 1 auto; min-width: 0; padding: 0; }
.picker .item, .sec .item { padding: 9px 10px; margin: 0 -4px; width: calc(100% + 8px); }
.picker .item + .item, .sec .item + .item { border-top: 1px solid var(--sep); }
.ledger .row b { font-variant-numeric: tabular-nums; }
.ledger .plus { color: var(--ok); }
.ledger .minus { color: var(--fg); }
.packs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.pack { flex: 1 1 90px; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--chip); border: 1.5px solid transparent; }
.pack b { font-size: 15px; }
.pack span { color: var(--fg); font-size: 14px; }
.pack small { color: var(--hint); font-size: 12px; }
.pack:active { border-color: var(--accent); }

/* состояния */
.state { text-align: center; padding: 28px 16px; background: var(--card); border-radius: var(--radius); margin-bottom: 12px; }
.state .big { font-size: 40px; line-height: 1; }
.state .title { margin: 12px 0 4px; }
.state .hint { margin: 0 auto; max-width: 34ch; }
.spin { width: 28px; height: 28px; margin: 4px auto 0; border: 3px solid var(--chip); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.skel { height: 56px; border-radius: 12px; background: linear-gradient(90deg, var(--card) 0%, color-mix(in srgb, var(--card) 70%, var(--bg)) 50%, var(--card) 100%);
  background-size: 200% 100%; animation: shimmer 1.2s ease-in-out infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.warn { color: var(--danger); font-size: 13.5px; margin-top: 8px; }
.foot { color: var(--hint); font-size: 13px; text-align: center; margin: 4px 0 12px; }

/* таббар и нижняя панель (замена MainButton вне Telegram) */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); height: calc(var(--tabbar-h) + var(--safe-b));
  padding: 0 max(4px, env(safe-area-inset-left, 0px)) var(--safe-b); background: var(--card); border-top: 1px solid var(--sep); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--hint); font-size: 11px; font-weight: 500; text-align: center; }
.tab .ico { font-size: 20px; line-height: 1.1; filter: grayscale(1) opacity(.75); }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab[aria-current="page"] .ico { filter: none; }
.bottombar { position: fixed; left: 0; right: 0; bottom: var(--safe-b); z-index: 21; display: flex; gap: 8px; padding: 10px max(14px, env(safe-area-inset-left, 0px)); background: var(--bg); }
body.tabs-on .bottombar { bottom: calc(var(--tabbar-h) + var(--safe-b)); }
.bar-btn { flex: 1 1 0; padding: 14px; border-radius: 12px; background: var(--chip); color: var(--fg); font-weight: 600; font-size: 16px; text-align: center; }
.bar-btn.primary { flex: 2 1 0; background: var(--accent); color: var(--on-accent); }

/* тосты */
#toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + 16px + var(--safe-b)); z-index: 30; display: flex; justify-content: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 12px; align-items: center; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: 92vw; overflow-wrap: anywhere; }
.toast-act { color: var(--bg); font-weight: 700; flex: none; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main id="view" class="view"></main>
<nav id="tabbar" class="tabbar" aria-label="Разделы" hidden></nav>
<div id="toasts"></div>
<script src="./demo.js"></script>
<script src="./app.js"></script>
</body>
</html>
